<!DOCTYPE html>
<html>
<head>
  <title>TaskFlow Dashboard</title>
  <!-- CSS principale -->

</head>

<!-- onload = esegue initApp appena la pagina è caricata -->
<body onload="initApp()">

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <!-- titolo app/logo -->
  <h2>TaskFlow</h2>

  <!-- menu navigazione -->
   <!-- TODO da implementare -->
  <div class="nav-item">Oggi</div>

  <div class="nav-item">Importanti</div>

  <hr style="margin:10px 0">

  <h4>Le mie liste</h4>

  <div class="nav-item">Personale</div>
  <div class="nav-item">Studio</div>

  <!-- TODO Implementare creazione lista (Form o semplicemente comparsa per barra d'input per il nome e pulsante crea) -->
  <div class="nav-item">+ Nuova Lista</div>
</div>

<!-- ================= TOPBAR ================= -->
<div class="topbar">

  <!-- TODO Implementare logica di ricerca -->

  <div>

    <button onclick="toggleTheme()">&#x1F314; Tema</button> <!-- 🌓 -->

    <!-- TODO Da implementare menù a tendina -->
    <div onclick="logout()">&#x1F464; Logout</div> <!-- 👤 -->
  </div>
</div>

<div class="main">

  <!-- TODO Dovranno comparire dinamicamente le liste dei todo (Da cambiare → i column dovranno contenere i div list con le task → optare per un div con display grid o n div con flex) -->

    <h3>Lavoro</h3>

    <div class="task">
      Fix backend JWT <span class="badge high">HIGH</span>
    </div>

    <div class="task done">
      Login API <span class="badge low">LOW</span>
    </div>
  </div>

  <div class="column">
    <h3>PERSONALE</h3>

    <div class="task">

    <!-- TODO I dati dovranno essere mostrati dinamicamente ed essere sincronizzati -->

    <hr>
    <!-- TODO vanno inserite le varie actions ed implementate le rispettive funzioni -->

    <button>Banna Utente</button>

<script src="app.js"></script>
